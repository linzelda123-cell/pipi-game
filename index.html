<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>皮皮草地奔跑</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#f4f7f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#213021}
  .wrap{max-width:820px;margin:auto;padding:12px}
  h1{font-size:24px;margin:4px 0}.sub{color:#657265;font-size:14px;margin-bottom:10px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .scene{position:relative;width:100%;aspect-ratio:720/430;border-radius:18px;overflow:hidden;border:1px solid #cfd8ca;background:#78c65b;touch-action:none}
  .scene svg{width:100%;height:100%;display:block}
  #dog{transform-box:fill-box;transform-origin:center}
  .controls{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .pad{display:grid;grid-template-columns:repeat(3,54px);gap:8px}
  .pad button,.action{min-width:54px;min-height:54px;border:1px solid #c9d2c6;border-radius:14px;background:#fff;font-size:20px;font-weight:700}
  .pad .blank{visibility:hidden}
  .action{font-size:15px;padding:0 16px;background:#eaf5ec}
  .msg{text-align:center;min-height:24px;color:#5e6b5e;font-size:14px;margin-top:10px}
  .score{font-size:16px}
  .note{font-size:12px;color:#6f7a6f;text-align:center;margin-top:8px}
  @media(max-width:520px){h1{font-size:21px}.wrap{padding:8px}.controls{gap:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div>
      <h1>皮皮草地奔跑 🐶</h1>
      <div class="sub">在小公園跑跑、撿球、聞花。</div>
    </div>
    <div class="score">分數：<strong id="score">0</strong></div>
  </div>

  <div id="scene" class="scene" tabindex="0" aria-label="皮皮草地奔跑遊戲">
    <svg id="park" viewBox="0 0 720 430" role="img" aria-label="綠色草地公園">
      <defs>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#92d66f"/>
          <stop offset="1" stop-color="#64b650"/>
        </linearGradient>
      </defs>
      <rect width="720" height="430" fill="url(#grass)"/>
      <rect x="24" y="24" width="672" height="382" rx="12" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3" stroke-dasharray="10 12"/>
      <rect x="270" y="18" width="180" height="28" rx="8" fill="#c9b27c"/>
      <rect x="270" y="384" width="180" height="28" rx="8" fill="#c9b27c"/>

      <g>
        <rect x="73" y="85" width="14" height="30" fill="#6e4b2a"/>
        <circle cx="80" cy="72" r="28" fill="#2f7e3f"/>
        <rect x="643" y="90" width="14" height="30" fill="#6e4b2a"/>
        <circle cx="650" cy="78" r="32" fill="#2f7e3f"/>
        <rect x="98" y="345" width="14" height="30" fill="#6e4b2a"/>
        <circle cx="105" cy="340" r="27" fill="#2f7e3f"/>
        <rect x="613" y="348" width="14" height="30" fill="#6e4b2a"/>
        <circle cx="620" cy="340" r="30" fill="#2f7e3f"/>
      </g>

      <g id="flowers">
        <g class="flower" data-x="220" data-y="90"><circle cx="220" cy="90" r="5" fill="#f4e66a"/><circle cx="226" cy="90" r="3" fill="#fff"/></g>
        <g class="flower" data-x="500" data-y="100"><circle cx="500" cy="100" r="5" fill="#f4e66a"/><circle cx="506" cy="100" r="3" fill="#fff"/></g>
        <g class="flower" data-x="190" data-y="315"><circle cx="190" cy="315" r="5" fill="#f4e66a"/><circle cx="196" cy="315" r="3" fill="#fff"/></g>
        <g class="flower" data-x="520" data-y="300"><circle cx="520" cy="300" r="5" fill="#f4e66a"/><circle cx="526" cy="300" r="3" fill="#fff"/></g>
        <g class="flower" data-x="355" data-y="70"><circle cx="355" cy="70" r="5" fill="#f4e66a"/><circle cx="361" cy="70" r="3" fill="#fff"/></g>
        <g class="flower" data-x="360" data-y="355"><circle cx="360" cy="355" r="5" fill="#f4e66a"/><circle cx="366" cy="355" r="3" fill="#fff"/></g>
      </g>

      <g id="ball" transform="translate(130 110)">
        <circle r="12" fill="#f1ce3f" stroke="#a88700" stroke-width="2"/>
        <path d="M-8,-5 Q0,0 8,5" fill="none" stroke="#c09c08" stroke-width="2"/>
      </g>

      <g id="dog" transform="translate(360 215)">
        <ellipse cx="0" cy="0" rx="18" ry="14" fill="#fafaf5" stroke="#d3d3cc"/>
        <circle cx="14" cy="0" r="11" fill="#fff"/>
        <circle cx="23" cy="0" r="3" fill="#222"/>
        <circle cx="13" cy="-4" r="2" fill="#222"/>
        <circle cx="13" cy="4" r="2" fill="#222"/>
        <circle cx="-18" cy="0" r="7" fill="#fff"/>
      </g>

      <text x="34" y="50" fill="rgba(20,40,20,.7)" font-size="16" font-family="system-ui">30 m² 皮皮公園</text>
    </svg>
  </div>

  <div class="controls">
    <div class="pad">
      <span class="blank"></span><button type="button" data-dir="up">↑</button><span class="blank"></span>
      <button type="button" data-dir="left">←</button><button type="button" data-dir="down">↓</button><button type="button" data-dir="right">→</button>
    </div>
    <button class="action" type="button" id="sniff">聞聞 👃</button>
    <button class="action" type="button" id="reset">重新開始</button>
  </div>

  <div id="msg" class="msg">去找黃色小球吧！</div>
  <div class="note">手機：按方向鍵｜電腦：方向鍵或 WASD</div>
</div>

<script>
(function(){
  const scene=document.getElementById('scene');
  const dogEl=document.getElementById('dog');
  const ballEl=document.getElementById('ball');
  const scoreEl=document.getElementById('score');
  const msg=document.getElementById('msg');
  const flowers=[...document.querySelectorAll('.flower')];

  const state={x:360,y:215,dir:0,score:0,bx:130,by:110};
  const keys=new Set();
  const trees=[{x:80,y:72,r:28},{x:650,y:78,r:32},{x:105,y:340,r:27},{x:620,y:340,r:30}];

  function render(){
    dogEl.setAttribute('transform',`translate(${state.x} ${state.y}) rotate(${state.dir})`);
    ballEl.setAttribute('transform',`translate(${state.bx} ${state.by})`);
    scoreEl.textContent=state.score;
  }

  function blocked(nx,ny){
    if(nx<28||nx>692||ny<28||ny>402)return true;
    return trees.some(t=>Math.hypot(nx-t.x,ny-t.y)<t.r+17);
  }

  function placeBall(){
    for(let i=0;i<50;i++){
      let x=55+Math.random()*610, y=55+Math.random()*320;
      if(!trees.some(t=>Math.hypot(x-t.x,y-t.y)<t.r+35)){
        state.bx=x;state.by=y;return;
      }
    }
  }

  function collect(){
    if(Math.hypot(state.x-state.bx,state.y-state.by)<34){
      state.score+=10; msg.textContent='撿到球！皮皮超爽 +10 🎾'; placeBall();
    }
    flowers.forEach(f=>{
      if(f.dataset.done)return;
      let x=Number(f.dataset.x),y=Number(f.dataset.y);
      if(Math.hypot(state.x-x,state.y-y)<25){
        f.dataset.done='1'; f.style.display='none'; state.score+=2;
        msg.textContent='聞到小花啦 +2 🌼';
      }
    });
  }

  function step(dx,dy){
    const speed=8;
    let nx=state.x+dx*speed, ny=state.y+dy*speed;
    if(!blocked(nx,ny)){state.x=nx;state.y=ny;state.dir=Math.atan2(dy,dx)*180/Math.PI;}
    collect();render();
  }

  function dirStep(dir){
    if(dir==='up')step(0,-1);
    if(dir==='down')step(0,1);
    if(dir==='left')step(-1,0);
    if(dir==='right')step(1,0);
  }

  let holdTimer=null;
  document.querySelectorAll('[data-dir]').forEach(btn=>{
    const dir=btn.dataset.dir;
    const start=e=>{
      e.preventDefault(); dirStep(dir);
      clearInterval(holdTimer); holdTimer=setInterval(()=>dirStep(dir),45);
    };
    const stop=()=>{clearInterval(holdTimer);holdTimer=null;};
    btn.addEventListener('pointerdown',start);
    btn.addEventListener('pointerup',stop);
    btn.addEventListener('pointercancel',stop);
    btn.addEventListener('pointerleave',stop);
  });

  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','w'].includes(k)){e.preventDefault();dirStep('up');}
    if(['arrowdown','s'].includes(k)){e.preventDefault();dirStep('down');}
    if(['arrowleft','a'].includes(k)){e.preventDefault();dirStep('left');}
    if(['arrowright','d'].includes(k)){e.preventDefault();dirStep('right');}
  });

  document.getElementById('sniff').addEventListener('click',()=>{
    const near=flowers.some(f=>!f.dataset.done&&Math.hypot(state.x-Number(f.dataset.x),state.y-Number(f.dataset.y))<80);
    msg.textContent=near?'附近有花香！🌼':'嗯……只有草味跟皮皮味 😂';
  });

  document.getElementById('reset').addEventListener('click',()=>{
    state.x=360;state.y=215;state.dir=0;state.score=0;state.bx=130;state.by=110;
    flowers.forEach(f=>{delete f.dataset.done;f.style.display='';});
    msg.textContent='去找黃色小球吧！';render();
  });

  render();
})();
</script>
</body>
</html>

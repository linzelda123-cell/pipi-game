<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>皮皮草地奔跑 v0.2</title>
<style>
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }
  html,body,.wrap,.scene,.controls,.pad,button,svg{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  button{
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  body{margin:0;background:#f4f7f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#213021}
  .wrap{max-width:860px;margin:auto;padding:12px}
  h1{font-size:24px;margin:4px 0}.sub{color:#657265;font-size:14px;margin-bottom:10px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:15px}
  .scene{position:relative;width:100%;aspect-ratio:760/460;border-radius:18px;overflow:hidden;border:1px solid #cfd8ca;background:#78c65b;touch-action:none}
  .scene svg{width:100%;height:100%;display:block}
  .controls{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .pad{display:grid;grid-template-columns:repeat(3,56px);gap:8px}
  .pad button,.action{min-width:56px;min-height:56px;border:1px solid #c9d2c6;border-radius:14px;background:#fff;font-size:21px;font-weight:700}
  .pad .blank{visibility:hidden}
  .action{font-size:15px;padding:0 16px;background:#eaf5ec}
  .msg{text-align:center;min-height:26px;color:#5e6b5e;font-size:14px;margin-top:10px}
  .legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:12px;color:#657265;margin-top:10px}
  .legend span{background:#fff;border:1px solid #d7dfd4;padding:5px 8px;border-radius:999px}
  .note{font-size:12px;color:#6f7a6f;text-align:center;margin-top:8px}
  @media(max-width:520px){h1{font-size:21px}.wrap{padding:8px}.controls{gap:8px}.stats{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div>
      <h1>皮皮草地奔跑 v0.2 🐶</h1>
      <div class="sub">小心饅頭的大便、狗尿和泥巴；去搶元寶的玩具！</div>
    </div>
    <div class="stats">
      <div>分數：<strong id="score">0</strong></div>
      <div>任務：<strong id="mission">搶 3 個玩具</strong></div>
    </div>
  </div>

  <div id="scene" class="scene" tabindex="0" aria-label="皮皮草地奔跑遊戲">
    <svg id="park" viewBox="0 0 760 460" role="img" aria-label="草地公園">
      <defs>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#94d874"/>
          <stop offset="1" stop-color="#63b64f"/>
        </linearGradient>
      </defs>

      <rect width="760" height="460" fill="url(#grass)"/>
      <rect x="24" y="24" width="712" height="412" rx="14" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3" stroke-dasharray="10 12"/>
      <rect x="290" y="18" width="180" height="28" rx="8" fill="#c9b27c"/>
      <rect x="290" y="414" width="180" height="28" rx="8" fill="#c9b27c"/>

      <g id="trees">
        <g><rect x="73" y="90" width="14" height="30" fill="#6e4b2a"/><circle cx="80" cy="76" r="28" fill="#2f7e3f"/></g>
        <g><rect x="673" y="95" width="14" height="30" fill="#6e4b2a"/><circle cx="680" cy="82" r="32" fill="#2f7e3f"/></g>
        <g><rect x="103" y="365" width="14" height="30" fill="#6e4b2a"/><circle cx="110" cy="355" r="27" fill="#2f7e3f"/></g>
        <g><rect x="643" y="365" width="14" height="30" fill="#6e4b2a"/><circle cx="650" cy="352" r="30" fill="#2f7e3f"/></g>
      </g>

      <g id="mud">
        <ellipse cx="330" cy="110" rx="36" ry="22" fill="#7d5b39" opacity=".85"/>
        <ellipse cx="470" cy="350" rx="42" ry="24" fill="#7d5b39" opacity=".85"/>
      </g>

      <g id="pee">
        <ellipse class="pee" data-x="165" data-y="220" cx="165" cy="220" rx="24" ry="12" fill="#e9df54" opacity=".82"/>
        <ellipse class="pee" data-x="585" data-y="210" cx="585" cy="210" rx="24" ry="12" fill="#e9df54" opacity=".82"/>
        <ellipse class="pee" data-x="390" data-y="295" cx="390" cy="295" rx="20" ry="10" fill="#e9df54" opacity=".82"/>
      </g>

      <g id="bench">
        <rect x="280" y="230" width="90" height="12" rx="4" fill="#8b5e3c"/>
        <rect x="287" y="242" width="8" height="24" fill="#5e402b"/>
        <rect x="355" y="242" width="8" height="24" fill="#5e402b"/>
      </g>

      <g id="ball" transform="translate(135 120)">
        <circle r="12" fill="#f1ce3f" stroke="#a88700" stroke-width="2"/>
        <path d="M-8,-5 Q0,0 8,5" fill="none" stroke="#c09c08" stroke-width="2"/>
      </g>

      <g id="mantou" transform="translate(600 125)">
        <ellipse cx="0" cy="8" rx="30" ry="22" fill="#e58d2c" stroke="#8d531a" stroke-width="2"/>
        <circle cx="0" cy="-12" r="20" fill="#e58d2c" stroke="#8d531a" stroke-width="2"/>
        <polygon points="-15,-25 -6,-36 -3,-22" fill="#e58d2c" stroke="#8d531a" stroke-width="2"/>
        <polygon points="15,-25 6,-36 3,-22" fill="#e58d2c" stroke="#8d531a" stroke-width="2"/>
        <ellipse cx="-7" cy="-13" rx="3" ry="5" fill="#222"/>
        <ellipse cx="7" cy="-13" rx="3" ry="5" fill="#222"/>
        <path d="M-15,-3 Q0,5 15,-3" fill="none" stroke="#8d531a" stroke-width="2"/>
      </g>

      <g id="poop" transform="translate(610 175)">
        <ellipse cx="0" cy="9" rx="12" ry="7" fill="#6b4326"/>
        <ellipse cx="0" cy="2" rx="9" ry="7" fill="#74492a"/>
        <ellipse cx="0" cy="-5" rx="6" ry="5" fill="#7d5130"/>
      </g>

      <g id="yuanbao" transform="translate(145 315)">
        <ellipse cx="0" cy="8" rx="21" ry="13" fill="#fff8ed" stroke="#b86d24" stroke-width="2"/>
        <circle cx="12" cy="-7" r="14" fill="#fff8ed" stroke="#b86d24" stroke-width="2"/>
        <polygon points="3,-17 8,-29 13,-16" fill="#e9953f" stroke="#b86d24" stroke-width="2"/>
        <polygon points="17,-17 23,-28 25,-13" fill="#e9953f" stroke="#b86d24" stroke-width="2"/>
        <path d="M-18,6 Q-35,-2 -31,-18" fill="none" stroke="#e9953f" stroke-width="5" stroke-linecap="round"/>
        <path d="M-6,-1 Q3,-8 10,-3" fill="none" stroke="#e9953f" stroke-width="7"/>
        <circle cx="8" cy="-9" r="2" fill="#222"/>
        <circle cx="16" cy="-9" r="2" fill="#222"/>
      </g>

      <g id="toy" transform="translate(190 310)">
        <circle r="10" fill="#d65b76"/>
        <line x1="8" y1="-7" x2="18" y2="-17" stroke="#7d3450" stroke-width="3"/>
        <circle cx="21" cy="-20" r="4" fill="#7d3450"/>
      </g>

      <g id="dog" transform="translate(380 225)">
        <ellipse cx="0" cy="0" rx="18" ry="14" fill="#fafaf5" stroke="#d3d3cc"/>
        <circle cx="14" cy="0" r="11" fill="#fff"/>
        <circle cx="23" cy="0" r="3" fill="#222"/>
        <circle cx="13" cy="-4" r="2" fill="#222"/>
        <circle cx="13" cy="4" r="2" fill="#222"/>
        <circle cx="-18" cy="0" r="7" fill="#fff"/>
      </g>

      <text x="34" y="50" fill="rgba(20,40,20,.7)" font-size="16" font-family="system-ui">皮皮公園</text>
    </svg>
  </div>

  <div class="controls">
    <div class="pad">
      <span class="blank"></span><button type="button" data-dir="up">↑</button><span class="blank"></span>
      <button type="button" data-dir="left">←</button><button type="button" data-dir="down">↓</button><button type="button" data-dir="right">→</button>
    </div>
    <button class="action" type="button" id="sniff">聞聞 👃</button>
    <button class="action" type="button" id="reset">重新開始</button>
  </div>

  <div id="msg" class="msg">任務：搶元寶的玩具 3 次！</div>
  <div class="legend">
    <span>💩 饅頭大便 -10</span>
    <span>🧸 元寶玩具 +5</span>
    <span>💦 狗尿 -3</span>
    <span>🟤 泥巴 -2</span>
    <span>🎾 黃球 +10</span>
  </div>
  <div class="note">手機：按方向鍵｜電腦：方向鍵或 WASD</div>
</div>

<script>
(function(){
  const gameWrap=document.querySelector('.wrap');
  if(gameWrap){
    gameWrap.addEventListener('contextmenu',e=>e.preventDefault());
    gameWrap.addEventListener('selectstart',e=>e.preventDefault());
  }

  const dogEl=document.getElementById('dog');
  const ballEl=document.getElementById('ball');
  const toyEl=document.getElementById('toy');
  const poopEl=document.getElementById('poop');
  const yuanbaoEl=document.getElementById('yuanbao');
  const mantouEl=document.getElementById('mantou');
  const scoreEl=document.getElementById('score');
  const missionEl=document.getElementById('mission');
  const msg=document.getElementById('msg');
  const peeEls=[...document.querySelectorAll('.pee')];

  const state={
    x:380,y:225,dir:0,score:0,bx:135,by:120,
    toyX:190,toyY:310,toyCount:0,
    poopX:610,poopY:175,
    yuanX:145,yuanY:315,
    mantouX:600,mantouY:125,
    mudCooldown:0,peeCooldown:0,poopCooldown:0
  };

  const trees=[{x:80,y:76,r:28},{x:680,y:82,r:32},{x:110,y:355,r:27},{x:650,y:352,r:30}];
  const mud=[{x:330,y:110,rx:36,ry:22},{x:470,y:350,rx:42,ry:24}];
  const bench={x1:272,y1:220,x2:378,y2:272};

  function render(){
    dogEl.setAttribute('transform',`translate(${state.x} ${state.y}) rotate(${state.dir})`);
    ballEl.setAttribute('transform',`translate(${state.bx} ${state.by})`);
    toyEl.setAttribute('transform',`translate(${state.toyX} ${state.toyY})`);
    poopEl.setAttribute('transform',`translate(${state.poopX} ${state.poopY})`);
    yuanbaoEl.setAttribute('transform',`translate(${state.yuanX} ${state.yuanY})`);
    mantouEl.setAttribute('transform',`translate(${state.mantouX} ${state.mantouY})`);
    scoreEl.textContent=state.score;
    missionEl.textContent=state.toyCount>=3?'完成！':'搶 3 個玩具';
  }

  function blocked(nx,ny){
    if(nx<28||nx>732||ny<28||ny>432)return true;
    if(trees.some(t=>Math.hypot(nx-t.x,ny-t.y)<t.r+17))return true;
    if(nx>bench.x1&&nx<bench.x2&&ny>bench.y1&&ny<bench.y2)return true;
    return false;
  }

  function randomSafePoint(){
    for(let i=0;i<80;i++){
      const x=55+Math.random()*650;
      const y=55+Math.random()*350;
      if(!trees.some(t=>Math.hypot(x-t.x,y-t.y)<t.r+38) &&
         !(x>bench.x1-25&&x<bench.x2+25&&y>bench.y1-25&&y<bench.y2+25)){
        return {x,y};
      }
    }
    return {x:380,y:225};
  }

  function placeBall(){
    const p=randomSafePoint(); state.bx=p.x; state.by=p.y;
  }

  function placeToy(){
    const p=randomSafePoint();
    state.toyX=p.x; state.toyY=p.y;
    state.yuanX=Math.max(35,Math.min(725,p.x-35));
    state.yuanY=Math.max(35,Math.min(425,p.y+8));
  }

  function placePoop(){
    const p=randomSafePoint();
    state.poopX=p.x;state.poopY=p.y;
    state.mantouX=Math.max(40,Math.min(720,p.x-30));
    state.mantouY=Math.max(40,Math.min(420,p.y-45));
  }

  function addScore(delta,text){
    state.score+=delta;
    msg.textContent=text;
  }

  function collect(){
    const now=Date.now();

    if(Math.hypot(state.x-state.bx,state.y-state.by)<34){
      addScore(10,'撿到球！皮皮超爽 +10 🎾');
      placeBall();
    }

    if(Math.hypot(state.x-state.toyX,state.y-state.toyY)<32){
      state.toyCount++;
      addScore(5,`搶到元寶的玩具！+5 🧸（${state.toyCount}/3）`);
      placeToy();
      if(state.toyCount===3){
        msg.textContent='任務完成！元寶氣到尾巴變兩倍粗 😂';
      }
    }

    if(Math.hypot(state.x-state.poopX,state.y-state.poopY)<30 && now>state.poopCooldown){
      state.poopCooldown=now+1400;
      addScore(-10,'踩到饅頭的大便 💩 -10');
      placePoop();
    }

    if(now>state.peeCooldown){
      for(const p of peeEls){
        const px=Number(p.dataset.x),py=Number(p.dataset.y);
        if(Math.hypot(state.x-px,state.y-py)<28){
          state.peeCooldown=now+1200;
          addScore(-3,'踩到狗尿了 💦 -3');
          break;
        }
      }
    }

    if(now>state.mudCooldown){
      for(const m of mud){
        const dx=(state.x-m.x)/m.rx,dy=(state.y-m.y)/m.ry;
        if(dx*dx+dy*dy<1){
          state.mudCooldown=now+1300;
          addScore(-2,'踩進泥巴，白毛毀滅 🟤 -2');
          break;
        }
      }
    }
  }

  function step(dx,dy){
    const speed=8;
    const nx=state.x+dx*speed, ny=state.y+dy*speed;
    if(!blocked(nx,ny)){
      state.x=nx;state.y=ny;state.dir=Math.atan2(dy,dx)*180/Math.PI;
    }else{
      msg.textContent='撞到障礙物了！';
    }
    collect();render();
  }

  function dirStep(dir){
    if(dir==='up')step(0,-1);
    if(dir==='down')step(0,1);
    if(dir==='left')step(-1,0);
    if(dir==='right')step(1,0);
  }

  let holdTimer=null;
  document.querySelectorAll('[data-dir]').forEach(btn=>{
    const dir=btn.dataset.dir;
    const start=e=>{
      e.preventDefault();dirStep(dir);
      clearInterval(holdTimer);
      holdTimer=setInterval(()=>dirStep(dir),45);
    };
    const stop=()=>{clearInterval(holdTimer);holdTimer=null;};
    btn.addEventListener('pointerdown',start);
    btn.addEventListener('pointerup',stop);
    btn.addEventListener('pointercancel',stop);
    btn.addEventListener('pointerleave',stop);
  });

  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','w'].includes(k)){e.preventDefault();dirStep('up');}
    if(['arrowdown','s'].includes(k)){e.preventDefault();dirStep('down');}
    if(['arrowleft','a'].includes(k)){e.preventDefault();dirStep('left');}
    if(['arrowright','d'].includes(k)){e.preventDefault();dirStep('right');}
  });

  document.getElementById('sniff').addEventListener('click',()=>{
    const dToy=Math.hypot(state.x-state.toyX,state.y-state.toyY);
    const dPoop=Math.hypot(state.x-state.poopX,state.y-state.poopY);
    if(dPoop<90) msg.textContent='皮皮聞到一股很不妙的味道……饅頭剛來過 💩';
    else if(dToy<100) msg.textContent='聞到元寶玩具的味道！就在附近 🧸';
    else msg.textContent='只有草味、泥巴味，還有一點貓味 👃';
  });

  document.getElementById('reset').addEventListener('click',()=>{
    Object.assign(state,{
      x:380,y:225,dir:0,score:0,bx:135,by:120,
      toyX:190,toyY:310,toyCount:0,
      poopX:610,poopY:175,
      yuanX:145,yuanY:315,
      mantouX:600,mantouY:125,
      mudCooldown:0,peeCooldown:0,poopCooldown:0
    });
    msg.textContent='任務：搶元寶的玩具 3 次！';
    render();
  });

  render();
})();
</script>
</body>
</html>

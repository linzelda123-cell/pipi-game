<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>皮皮真正3D公園 v0.4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ed9ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:12px;top:12px;z-index:5;background:#ffffffe8;padding:8px 11px;border-radius:13px;font-size:14px}
#msg{position:fixed;right:12px;top:12px;z-index:5;background:#243324cc;color:#fff;padding:8px 11px;border-radius:13px;font-size:13px;max-width:48vw}
#stick{position:fixed;left:20px;bottom:22px;width:122px;height:122px;border:2px solid #ffffffaa;border-radius:50%;background:#ffffff38;z-index:8;touch-action:none}
#knob{position:absolute;left:39px;top:39px;width:44px;height:44px;border-radius:50%;background:#fffffff0}
#reset{position:fixed;right:22px;bottom:30px;width:64px;height:64px;border:0;border-radius:50%;z-index:8;background:#fffffff0;font-weight:700}
#rotateHint{position:fixed;left:50%;bottom:5px;transform:translateX(-50%);z-index:5;color:#fff;text-shadow:0 1px 4px #000;font-size:11px}
</style></head><body>
<div id="hud"><b>皮皮 3D 公園 🐶</b><br>分數 <b id="score">0</b>　玩具 <b id="toys">0</b>/3</div>
<div id="msg">左手移動；右半邊拖曳旋轉鏡頭</div><div id="stick"><div id="knob"></div></div>
<button id="reset">重來</button><div id="rotateHint">建議將手機橫向遊玩</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9dcf7);scene.fog=new THREE.Fog(0xa9dcf7,18,32);
const cam=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,60);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,1.7));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x587b45,2.4));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-7,14,8);sun.castShadow=true;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
function mesh(g,c){const m=new THREE.Mesh(g,mat(c));m.castShadow=true;m.receiveShadow=true;return m}
const ground=mesh(new THREE.PlaneGeometry(7.75,4),0x70bb50);ground.scale.set(2,2,2);ground.rotation.x=-Math.PI/2;scene.add(ground);
const path=mesh(new THREE.PlaneGeometry(1.2,8),0xcab27c);path.rotation.x=-Math.PI/2;path.position.y=.01;scene.add(path);
const blocks=[];
function tree(x,z,s=1){let t=mesh(new THREE.CylinderGeometry(.13,.18,.9,10),0x714823);t.position.set(x,.45,z);scene.add(t);let c=mesh(new THREE.SphereGeometry(.58*s,14,10),0x337f42);c.position.set(x,1.18*s,z);scene.add(c);blocks.push({x,z,r:.48*s})}
tree(-3,-3);tree(3,-3,1.05);tree(-3,3);tree(3,3,1.08);
function bench(x,z,r=0){let g=new THREE.Group(),a=mesh(new THREE.BoxGeometry(1.2,.12,.35),0x8c5d39);a.position.y=.38;g.add(a);let b=mesh(new THREE.BoxGeometry(1.2,.48,.1),0x8c5d39);b.position.set(0,.64,-.16);g.add(b);g.position.set(x,0,z);g.rotation.y=r;scene.add(g);blocks.push({x,z,r:.72})}
bench(-1.8,1.3,.2);bench(2,-1.3,-.3);
function dog(){
 let g=new THREE.Group();
 let b=mesh(new THREE.SphereGeometry(.3,14,10),0xf8f7ef);b.scale.set(1,.78,1.45);b.position.y=.43;g.add(b);
 let h=mesh(new THREE.SphereGeometry(.25,14,10),0xffffff);h.position.set(0,.64,.4);g.add(h);
 let muzzle=mesh(new THREE.SphereGeometry(.12,12,8),0xffffff);muzzle.scale.set(1,.72,1.15);muzzle.position.set(0,.57,.61);g.add(muzzle);
 let n=mesh(new THREE.SphereGeometry(.045,8,6),0x222222);n.position.set(0,.59,.72);g.add(n);
 for(const x of [-.105,.105]){let eye=mesh(new THREE.SphereGeometry(.027,8,6),0x181818);eye.position.set(x,.68,.59);g.add(eye)}
 for(const x of [-.22,.22]){let ear=mesh(new THREE.SphereGeometry(.13,10,8),0xf4f1e8);ear.scale.set(.58,1.35,.5);ear.position.set(x,.59,.36);ear.rotation.z=x<0?-.2:.2;g.add(ear)}
 for(const x of [-.18,.18])for(const z of [-.18,.42]){let leg=mesh(new THREE.CylinderGeometry(.055,.065,.34,8),0xf7f5ee);leg.position.set(x,.19,z);g.add(leg);let paw=mesh(new THREE.SphereGeometry(.07,8,6),0xffffff);paw.scale.set(1,.55,1.15);paw.position.set(x,.035,z+.02);g.add(paw)}
 let tail=mesh(new THREE.TorusGeometry(.17,.045,7,12,Math.PI*1.45),0xffffff);tail.position.set(0,.55,-.47);tail.rotation.set(Math.PI/2,0,.5);g.add(tail);
 return g
}
const pipi=dog();scene.add(pipi);
function cat(fat){
 let g=new THREE.Group(),orange=0xe48c30,cream=0xfff7e9,col=fat?orange:cream;
 let b=mesh(new THREE.SphereGeometry(fat?.34:.25,12,9),col);b.scale.set(fat?1.35:.8,.78,fat?1.08:1.45);b.position.y=.38;g.add(b);
 let h=mesh(new THREE.SphereGeometry(fat?.24:.19,12,9),fat?orange:cream);h.position.set(0,fat?.61:.58,.3);g.add(h);
 for(const x of [fat?-.14:-.11,fat?.14:.11]){let ear=mesh(new THREE.ConeGeometry(fat?.085:.07,fat?.2:.17,4),orange);ear.position.set(x,fat?.85:.79,.3);ear.rotation.y=Math.PI/4;g.add(ear)}
 for(const x of [fat?-.2:-.13,fat?.2:.13])for(const z of [-.16,.3]){let leg=mesh(new THREE.CylinderGeometry(fat?.045:.035,fat?.05:.04,fat?.25:.28,7),col);leg.position.set(x,.16,z);g.add(leg)}
 let tail=mesh(new THREE.CylinderGeometry(fat?.045:.035,fat?.06:.045,fat?.65:.75,8),orange);tail.position.set(fat?.36:.25,.48,-.28);tail.rotation.z=fat?-.8:-1.05;tail.rotation.x=.35;g.add(tail);
 for(const x of [-.075,.075]){let eye=mesh(new THREE.SphereGeometry(.018,7,5),0x1b1b1b);eye.position.set(x,fat?.65:.62,.47);g.add(eye)}
 return g
}
const mantou=cat(true),yuanbao=cat(false);scene.add(mantou,yuanbao);
function labelSprite(text){
 const cv=document.createElement('canvas');cv.width=256;cv.height=96;const x=cv.getContext('2d');
 x.fillStyle='rgba(30,30,30,.72)';x.roundRect(20,12,216,65,22);x.fill();
 x.fillStyle='white';x.font='bold 38px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,128,45);
 const tex=new THREE.CanvasTexture(cv);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));sp.scale.set(.85,.32,1);return sp
}
const ml=labelSprite('饅頭'),yl=labelSprite('元寶');mantou.add(ml);yuanbao.add(yl);ml.position.set(0,1.05,0);yl.position.set(0,.95,0);
function sphere(c,r=.13){let m=mesh(new THREE.SphereGeometry(r,12,8),c);m.position.y=r;scene.add(m);return m}
const ball=sphere(0xf1cb32,.13),toy=sphere(0xd85d79,.12);
const poop=new THREE.Group();[0,.07,.13].forEach((y,i)=>{let p=mesh(new THREE.SphereGeometry(.13-i*.025,10,7),0x704426);p.scale.y=.6;p.position.y=.07+y;poop.add(p)});scene.add(poop);
const pees=[],muds=[];function puddle(x,z,c,r){let p=mesh(new THREE.CircleGeometry(r,20),c);p.rotation.x=-Math.PI/2;p.position.set(x,.012,z);scene.add(p);return p}
pees.push(puddle(-2.4,.3,0xe7dc4b,.27),puddle(2.5,.5,0xe7dc4b,.27),puddle(.7,2.5,0xe7dc4b,.25));
muds.push(puddle(-1.5,-2.2,0x765439,.38),puddle(2.1,2.4,0x765439,.42));
function safe(){for(let i=0;i<80;i++){let x=-3.35+Math.random()*6.7,z=-3.35+Math.random()*6.7;if(Math.abs(x)<.75)continue;if(blocks.every(b=>Math.hypot(x-b.x,z-b.z)>b.r+.55))return{x,z}}return{x:2,z:2}}
function place(o){let p=safe();o.position.x=p.x;o.position.z=p.z}function toySpawn(){place(toy);yuanbao.position.set(toy.position.x-.38,0,toy.position.z+.2)}function poopSpawn(){place(poop);mantou.position.set(poop.position.x-.42,0,poop.position.z-.38)}
place(ball);toySpawn();poopSpawn();
let score=0,toys=0,last=0,yaw=0,camYaw=0;
const scoreEl=document.querySelector('#score'),toysEl=document.querySelector('#toys'),msg=document.querySelector('#msg');
const dist=(a,b)=>Math.hypot(a.position.x-b.position.x,a.position.z-b.position.z);
function pts(n,t){score+=n;scoreEl.textContent=score;msg.textContent=t}
function check(){let now=performance.now();if(dist(pipi,ball)<.38){pts(10,'撿到球 +10 🎾');place(ball)}if(dist(pipi,toy)<.38){toys++;toysEl.textContent=toys;pts(5,'搶到元寶玩具 +5 🧸');toySpawn()}if(now-last>900&&dist(pipi,poop)<.36){last=now;pts(-10,'踩到饅頭大便 -10 💩');poopSpawn()}if(now-last>900)for(const p of pees)if(dist(pipi,p)<.4){last=now;pts(-3,'踩到狗尿 -3 💦');break}if(now-last>900)for(const p of muds)if(dist(pipi,p)<.5){last=now;pts(-2,'白毛踩泥巴 -2');break}}
function blocked(x,z){return Math.abs(x)>3.55||Math.abs(z)>3.55||blocks.some(b=>Math.hypot(x-b.x,z-b.z)<b.r+.25)}
const joy={x:0,y:0},stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let dragging=false,pid=0;
function jm(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=r.width*.33,d=Math.hypot(dx,dy)||1;if(d>m){dx=dx/d*m;dy=dy/d*m}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}
stick.onpointerdown=e=>{dragging=true;pid=e.pointerId;stick.setPointerCapture(pid);jm(e);e.preventDefault()};stick.onpointermove=e=>{if(dragging&&e.pointerId===pid)jm(e)};function end(){dragging=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.onpointerup=end;stick.onpointercancel=end;
let lookPid=null,lastX=0;ren.domElement.onpointerdown=e=>{if(e.clientX>innerWidth*.42){lookPid=e.pointerId;lastX=e.clientX;ren.domElement.setPointerCapture(e.pointerId)}};ren.domElement.onpointermove=e=>{if(e.pointerId===lookPid){camYaw-=(e.clientX-lastX)*.006;lastX=e.clientX}};ren.domElement.onpointerup=e=>{if(e.pointerId===lookPid)lookPid=null};
document.oncontextmenu=e=>e.preventDefault();document.onselectstart=e=>e.preventDefault();
document.querySelector('#reset').onclick=()=>{score=toys=0;scoreEl.textContent=toysEl.textContent=0;pipi.position.set(0,0,0);yaw=camYaw=0;place(ball);toySpawn();poopSpawn();msg.textContent='重新開始'};
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.035),ix=joy.x,iy=-joy.y,m=Math.hypot(ix,iy);if(m>.08){let moveAng=camYaw+Math.atan2(-ix,iy);yaw=moveAng;let nx=pipi.position.x+Math.sin(moveAng)*2.2*dt,nz=pipi.position.z+Math.cos(moveAng)*2.2*dt;if(!blocked(nx,nz)){pipi.position.x=nx;pipi.position.z=nz}pipi.rotation.y=yaw;pipi.position.y=Math.abs(Math.sin(performance.now()*.015))*.025}else pipi.position.y=0;check();let d=3.1,h=1.9,desired=pipi.position.clone().add(new THREE.Vector3(-Math.sin(camYaw)*d,h,-Math.cos(camYaw)*d));cam.position.lerp(desired,1-Math.pow(.001,dt));cam.lookAt(pipi.position.clone().add(new THREE.Vector3(0,.45,0)));ren.render(scene,cam)}
loop();onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)}
</script></body></html>
